# 小说阅读服务 - 应用配置文件
# 敏感信息请通过环境变量注入，不要硬编码到代码中

spring:
  application:
    name: novel-reader-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reader_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

# Legado 服务端配置（Docker 中的 Legado 地址）
legado:
  base-url: ${LEGADO_BASE_URL:http://localhost:1234}
  ws-url: ${LEGADO_WS_URL:ws://localhost:1235}
  username: ${LEGADO_USERNAME:}      # Legado 认证用户名（无认证时留空）
  password: ${LEGADO_PASSWORD:}      # Legado 认证密码（无认证时留空）
  connect-timeout: ${LEGADO_CONNECT_TIMEOUT:10000}
  read-timeout: ${LEGADO_READ_TIMEOUT:60000}
  search-timeout: ${LEGADO_SEARCH_TIMEOUT:15}  # 搜索超时（秒）

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:reader-bucket}
    cdn-domain: ${ALIYUN_OSS_CDN_DOMAIN:}
    presign-expires: ${ALIYUN_OSS_PRESIGN_EXPIRES:3600}  # 预签名URL有效期（秒）

# JWT 配置
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production-env}
  expire-hours: ${JWT_EXPIRE_HOURS:720}  # 默认30天

# 下载并发配置
download:
  concurrency: ${DOWNLOAD_CONCURRENCY:3}  # 章节下载并发数

# 日志配置
logging:
  level:
    root: INFO
    com.reader.novel: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
